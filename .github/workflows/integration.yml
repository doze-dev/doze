# End-to-end suite: boot the real doze CLI against real engine plugins + real
# backend binaries on both Linux and macOS, and assert behaviour (see
# test/integration). This is what proves the engines actually work — and work on
# Linux — which the unit tests (fake drivers) can't.
#
# It builds plugins from a sibling doze-modules checkout and, by default, lets doze
# fetch each backend binary from the registry (needs network). It is heavy and can
# be flaky against live infra, so it runs on demand + nightly rather than on every
# PR. To make a run hermetic, pre-build a backend and pass DOZE_<ENGINE>_BINDIR.
#
# doze-sdk is a normal tagged dependency now; only doze-modules is a sibling
# (the suite builds plugins from its source).
name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # nightly, 06:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: doze }
      - uses: actions/checkout@v4
        with: { repository: doze-dev/doze-modules, path: doze-modules }
      - uses: actions/setup-go@v5
        with:
          go-version-file: doze/go.mod
          cache-dependency-path: |
            doze/go.sum
            doze-modules/go.sum
      # The suite builds doze and the plugins itself, where a proxy hiccup
      # fails every test at once. Download first, with retries.
      - name: Download modules
        run: |
          for dir in doze doze-modules; do
            for try in 1 2 3; do
              (cd "$dir" && go mod download) && break
              [ "$try" = 3 ] && exit 1
              sleep $((try * 10))
            done
          done
      - name: Run e2e suite
        working-directory: doze
        env:
          DOZE_MODULES_DIR: ${{ github.workspace }}/doze-modules
        run: go test -tags integration -v -timeout 20m ./test/integration/...

  # The .doze zone, end to end. The first step is the one-time machine setup a
  # user runs (it needs sudo, which a runner has); the test then starts a stack
  # and looks one of its names up through the operating system's own resolver,
  # the way psql and curl do. The other two tests run doze beside a second
  # program in a private zone, in each start order.
  names:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reverse lookup of 127.0.0.1, before setup
        if: runner.os == 'macOS'
        run: |
          python3 -c "import socket,time; t=time.time(); socket.getfqdn('127.0.0.1'); print('getfqdn before setup: %.2fs' % (time.time()-t))"
      - name: Set the machine up for .doze names
        run: |
          go build -o "$RUNNER_TEMP/doze" ./cmd/doze
          "$RUNNER_TEMP/doze" doctor --fix
      - name: Reverse lookup of 127.0.0.1, after setup
        if: runner.os == 'macOS'
        run: |
          python3 -c "import socket,time; t=time.time(); socket.getfqdn('127.0.0.1'); print('getfqdn after setup: %.2fs' % (time.time()-t))"
      - name: Names
        env:
          DOZE_TEST_DUMP: "1"
          DOZE_TEST_SYSTEM_RESOLVER: "1"
        run: >
          go test -tags integration -count=1 -v
          -run 'TestNamesThroughTheSystemResolver|TestDozeAndAStandaloneToolShareTheZone|TestANameAStandaloneToolHoldsStopsTheStack'
          ./test/integration/

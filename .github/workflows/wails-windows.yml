# What linking Wails costs a Windows process that never opens a window (a CLI
# or a daemon sharing a binary with the app): start-and-exit time, peak
# memory, the DLLs loaded before main, the COM state of the main thread, and
# which Wails package inits take the time. The Linux side of this question is
# d0.yml and wailsapp/wails#6583. Run by hand; see tools/wailswin.
#
# Given a Wails branch (repository and ref), it also measures that branch
# beside stock Wails, opens a real window with it (built on the main goroutine
# and on another one), and runs its Windows tests for the packages involved.
name: wails-windows

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs of each probe
        default: "300"
      wails_repo:
        description: A Wails repository to compare with stock (owner/name)
        default: doze-dev/wails
      wails_ref:
        description: Its branch or commit; empty measures stock Wails alone
        default: ""

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: tools/wailswin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: tools/wailswin/go.mod, cache-dependency-path: tools/wailswin/go.sum }
      - name: The Wails branch
        if: inputs.wails_ref != ''
        uses: actions/checkout@v4
        with: { repository: "${{ inputs.wails_repo }}", ref: "${{ inputs.wails_ref }}", path: wails-branch }
      - name: Build the probes
        env: { CGO_ENABLED: "0" }
        run: |
          go build -o plain.exe ./probe
          go build -tags wails -o stock.exe ./probe
          go build -tags wails,dllhook -o stock-hook.exe ./probe
          go build -tags wails -o smoke-stock.exe ./smoke
          if [ -d ../../wails-branch ]; then
            go mod edit -replace github.com/wailsapp/wails/v3=../../wails-branch/v3
            go mod tidy
            go build -tags wails -o branch.exe ./probe
            go build -tags wails,dllhook -o branch-hook.exe ./probe
            go build -tags wails -o smoke-branch.exe ./smoke
          fi
          ls -l *.exe
      - name: Measure
        run: |
          bins="plain.exe stock.exe"
          [ -f branch.exe ] && bins="$bins branch.exe"
          go run ./runner -n "${{ inputs.runs }}" $bins | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Which code loads which DLL before main
        run: |
          {
            for b in stock branch; do
              [ -f $b-hook.exe ] || continue
              echo; echo "#### DLLs loaded before main, $b"; echo; echo '```'
              ./$b-hook.exe 2>&1 | grep dllhook | head -60
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A window, with stock Wails and with the branch
        run: |
          {
            for b in stock branch; do
              [ -f smoke-$b.exe ] || continue
              echo; echo "#### A window, $b"; echo; echo '```'
              for mode in main worker service; do
                arg=""; [ "$mode" != main ] && arg=$mode
                if out=$(timeout 120 ./smoke-$b.exe $arg 2>&1); then echo "$b $mode: $out" | grep smoke:; else echo "$b $mode: FAILED ($?)"; echo "$out" | head -30; fi
              done
              echo '```'
            done
          } | tee smoke.log | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -q "branch .*FAILED" smoke.log
      - name: The branch's Windows tests
        if: inputs.wails_ref != ''
        working-directory: wails-branch/v3
        env: { CGO_ENABLED: "0" }
        run: |
          go test -count=1 -timeout 20m ./pkg/w32/... ./internal/go-common-file-dialog/... ./internal/webview2/... ./pkg/application/ 2>&1 | tee test.log | tail -40
          { echo; echo "#### Branch tests"; echo; echo '```'; grep -E "^(ok|FAIL|---|panic)" test.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -qE "^(FAIL|panic)" test.log

  # The same window, on Linux with the purego GTK4 backend: the App built on
  # the main goroutine, on another one, and with the window opened from a
  # ServiceStartup, against stock Wails and the branch.
  linux:
    if: inputs.wails_ref != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools/wailswin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: tools/wailswin/go.mod, cache-dependency-path: tools/wailswin/go.sum }
      - name: The Wails branch
        uses: actions/checkout@v4
        with: { repository: "${{ inputs.wails_repo }}", ref: "${{ inputs.wails_ref }}", path: wails-branch }
      - name: GTK4, WebKitGTK 6.0, Xvfb, D-Bus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-4 libgtk-4-1 xvfb xauth dbus-x11
      # WebKitGTK sandboxes its web process with bubblewrap, which Ubuntu 24.04
      # allows only under an AppArmor profile granting user namespaces (d0.yml).
      - name: AppArmor profile for the smoke binaries
        run: |
          sudo tee /etc/apparmor.d/wailswin-smoke >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile wailswin-smoke ${{ runner.temp }}/smoke/smoke-* flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/wailswin-smoke
      - name: Build the smoke test against stock Wails and the branch
        env: { CGO_ENABLED: "0" }
        run: |
          mkdir -p "${{ runner.temp }}/smoke"
          go build -tags wails,purego -o "${{ runner.temp }}/smoke/smoke-stock" ./smoke
          go mod edit -replace github.com/wailsapp/wails/v3=../../wails-branch/v3
          go mod tidy
          go build -tags wails,purego -o "${{ runner.temp }}/smoke/smoke-branch" ./smoke
      - name: A window, with stock Wails and with the branch
        run: |
          {
            for b in stock branch; do
              echo; echo "#### A window on Linux, $b"; echo; echo '```'
              for mode in main worker service; do
                arg=""; [ "$mode" != main ] && arg=$mode
                if out=$(timeout 120 dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" "${{ runner.temp }}/smoke/smoke-$b" $arg 2>&1); then echo "$b $mode: $(echo "$out" | grep smoke: | tr '\n' ' ')"; else echo "$b $mode: FAILED ($?)"; echo "$out" | head -30; fi
              done
              echo '```'
            done
          } | tee smoke.log | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -q "branch .*FAILED" smoke.log

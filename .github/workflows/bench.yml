# Memory and wake budgets on every PR, not nightly: a regression is caught in
# the change that causes it. Boots the fixture stack (examples/shop) with real
# engines and holds it to test/bench/budget.json, per OS.
name: bench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Measure against the budget
        env:
          DOZE_BENCH_OUT: ${{ runner.temp }}/bench-${{ matrix.os }}.json
        run: make bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench-${{ matrix.os }}.json
          if-no-files-found: ignore

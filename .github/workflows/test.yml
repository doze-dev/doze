# Every PR and push to main: lint, module hygiene, vet, and the race-enabled
# unit tests on Linux and macOS. The suite that boots real engines is
# integration.yml; the memory and wake budgets are bench.yml.
name: test

on:
  pull_request:
  push:
    branches: [main]

# Wails in purego mode needs the tag in every go invocation, or the GUI
# package does not compile under CGO_ENABLED=0 (see Makefile).
env:
  GOFLAGS: -tags=purego

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      # The release is one binary per platform, cross-compiled without cgo;
      # prove every target still builds, and that the desk tests compile on
      # Linux, before anything runs.
      - name: Cross-builds without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            go build -o /dev/null ./cmd/doze
            go vet ./internal/desk/... ./cmd/doze/...
            go test -c -o /dev/null ./internal/desk/app/
          done

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: go.mod is tidy
        run: go mod tidy -diff
      # doze builds from a clean clone only when every doze-* dependency is a
      # published tag. A pseudo-version pins a commit that may never have been
      # pushed (doze failed to build for weeks that way).
      - name: doze dependencies are tagged releases
        run: |
          bad=$(go list -m -f '{{if not .Main}}{{.Path}} {{.Version}}{{end}}' all \
            | awk '$1 ~ /^github.com\/doze-dev\// && $2 ~ /[-.][0-9]{14}-[0-9a-f]{12}$/')
          if [ -n "$bad" ]; then
            echo "::error::doze-* dependencies must be tagged releases, not commits:"
            echo "$bad"
            exit 1
          fi
      # Build the way a user's machine does: every module from the public
      # proxy, no workspace, no direct fetch from GitHub. (The one replace,
      # the doze-dev/wails fork, is a public tag the proxy serves.)
      - name: Builds from the public module proxy
        env:
          GOWORK: "off"
          GOFLAGS: -mod=readonly -tags=purego
          GOPROXY: https://proxy.golang.org
          GOMODCACHE: ${{ runner.temp }}/clean-modcache
        run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The app's page is built here and held to its budgets (internal/desk/web);
  # the Go tests elsewhere pass with the committed placeholder.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build the page
        run: make frontend
      - name: Budgets
        run: go test -v -run "Budget|GPU" ./internal/desk/web/
      - name: Bindings are current
        run: make bindings-check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=cover.out ./...
      # Coverage may rise but not fall: test/coverage-floor.txt is the floor.
      # Raise it when coverage improves; never lower it to make a PR pass.
      - name: Coverage floor
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          floor=$(cat test/coverage-floor.txt)
          echo "coverage $total% (floor $floor%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t+0 >= f+0) }' || {
            echo "::error::coverage $total% is below the floor of $floor%"; exit 1; }

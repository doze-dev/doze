# Cut a doze release on every version tag: goreleaser builds the three supported
# platforms (darwin/arm64, linux/amd64, linux/arm64), publishes the GitHub
# release with checksums, and pushes the Homebrew formula to doze-dev/homebrew-tap.
#
# HOMEBREW_TAP_TOKEN: a fine-grained PAT with contents:write on
# doze-dev/homebrew-tap (github.token cannot cross repositories).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser derives the changelog from tag history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      # The app's page is built into the binary; without this the release
      # would ship the committed placeholder.
      - name: Build the page
        run: make frontend
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Doze.app: the same binary in a bundle, signed with the Developer ID,
  # notarised and stapled, attached to the release as Doze.app.zip. Runs on
  # macOS because signing and notarisation need Apple's tools. Secrets:
  # DEVELOPER_ID_P12 (base64 of the .p12), DEVELOPER_ID_P12_PASSWORD,
  # NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY (the App Store Connect .p8).
  # Without them the job still bundles and ad-hoc signs, and says so.
  app:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GOFLAGS: -tags=purego
      # A step's `if` cannot see its own env, so these live on the job.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - name: Build doze with the page
        run: make build VERSION=${GITHUB_REF_NAME#v}
      - name: Import the Developer ID
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ci.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/ci.keychain-db"
          id=$(security find-identity -v -p codesigning "$RUNNER_TEMP/ci.keychain-db" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "DOZE_SIGN_ID=$id" >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY_KEY" = "true" ]; then
            echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          else
            echo "no NOTARY_KEY: signing only, not notarising"
          fi
      - name: Bundle, sign, notarise
        run: sh build/darwin/bundle.sh doze dist ${GITHUB_REF_NAME#v}
      - name: The disk image
        run: sh build/darwin/dmg.sh dist ${GITHUB_REF_NAME#v}
      - name: Attach Doze.app.zip and the disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dist/Doze.app.zip ] || ditto -c -k --keepParent dist/Doze.app dist/Doze.app.zip
          gh release upload "$GITHUB_REF_NAME" dist/Doze.app.zip "dist/Doze-${GITHUB_REF_NAME#v}.dmg" --clobber
      # The cask in doze-dev/homebrew-tap, beside the formula: only for a
      # signed and notarised image, since an unsigned one would not open.
      - name: Update the Homebrew cask
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true' && env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          sum=$(shasum -a 256 "dist/Doze-$v.dmg" | cut -d" " -f1)
          sed -e "s/__VERSION__/$v/" -e "s/__SHA256__/$sum/" build/darwin/doze.rb.tmpl > dist/doze.rb
          sha=$(gh api repos/doze-dev/homebrew-tap/contents/Casks/doze.rb --jq ".sha // empty" 2>/dev/null) || sha=""
          gh api -X PUT repos/doze-dev/homebrew-tap/contents/Casks/doze.rb \
            -f message="doze $v (cask)" -f content="$(base64 < dist/doze.rb | tr -d '\n')" \
            ${sha:+-f sha="$sha"}
